<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=./tokyo-walking-map.html" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Walking Map is a Tokyo walkability demo that visualizes how far a person can walk from nearby train stations." />
  <meta name="theme-color" content="#0f172a" />
  <title>Walking Map Demo</title>
  <style>
    :root {
      --bg: #f3f7f1;
      --panel: rgba(255, 255, 255, 0.9);
      --text: #122033;
      --muted: #516074;
      --accent: #0f766e;
      --accent-2: #1d4ed8;
      --shadow: rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(34, 197, 94, 0.12), transparent 28%),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.12), transparent 24%),
        linear-gradient(135deg, #edf7ee 0%, #f5f7fb 100%);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    .box {
      width: min(560px, calc(100vw - 32px));
      text-align: center;
      padding: 36px 28px 30px;
      border-radius: 20px;
      background: var(--panel);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 18px 44px var(--shadow);
      backdrop-filter: blur(10px);
    }

    .badge {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.1);
      color: var(--accent);
      border: 1px solid rgba(15, 118, 110, 0.18);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: clamp(1.9rem, 3vw, 2.5rem);
      line-height: 1.15;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    a {
      color: var(--accent-2);
      font-weight: 700;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="badge">Walking Map</div>
    <h2>Redirecting to the live demo...</h2>
    <p>If you are not redirected automatically, <a href="./tokyo-walking-map.html">click here to open the map</a>.</p>
  </div>
</body>
</html>
